<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bennett Sales Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./css/app.css">
<script type="module" src="./js/model-viewer.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="brand" onclick="go('home')" aria-label="Bennett Buildings home"><span class="mark">B</span><span class="brand-name">BENNETT<small>BUILDINGS</small></span></button>
    <nav class="topnav" aria-label="Main">
      <button data-nav="home" onclick="go('home')">Home</button>
      <button data-nav="lot" onclick="go('lot')">My lot</button>
      <button data-nav="orders" onclick="go('orders')">Orders</button>
      <button data-nav="performance" onclick="go('performance')">Performance</button>
      <button data-nav="stock" onclick="go('stock')">Restock</button>
    </nav>
    <div class="topbar-right">
      <span class="location">Statesboro, GA</span>
      <button class="topcta" onclick="S.saleLead=null;go('start')">Start a sale</button>
    </div>
  </div>
</header>
<div class="previewstrip">
  <div class="previewstrip-in"><strong>Preview</strong><span>Fictional customers · simulated actions</span><button onclick="go('notes')">Sources and open decisions</button></div>
</div>
<main id="app"></main>
<nav class="tabbar" aria-label="Main">
  <button data-nav="home" onclick="go('home')"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Home</span></button>
  <button data-nav="lot" onclick="go('lot')"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 20.5h19"/><path d="M5 20.5V10l7-5 7 5v10.5"/><path d="M10 20.5v-6h4v6"/></svg><span>My lot</span></button>
  <button class="tab-sale" onclick="S.saleLead=null;go('start')" aria-label="Start a sale"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Sale</span></button>
  <button data-nav="orders" onclick="go('orders')"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Orders</span></button>
  <button data-nav="performance" onclick="go('performance')"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg><span>Stats</span></button>
  <button data-nav="stock" onclick="go('stock')"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span>Restock</span></button>
</nav>
<div id="toast" role="status" hidden></div>
<script src="./js/qr.js"></script>
<script src="./js/model-colors.js"></script>
<script src="./js/catalog-options.js"></script>
<script src="./js/door-thumbnails.js"></script>
<script src="./js/core.js"></script>
<script src="./js/views.js"></script>
</body>
</html>
